name = "dream_mock_server"
version = "2.0.0"
description = "General-purpose HTTP mock server developed by Dream - provides both streaming and non-streaming endpoints for testing HTTP clients"
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream_mock_server" }
links = [
    { title = "Documentation", href = "https://hexdocs.pm/dream_mock_server" },
    { title = "GitHub", href = "https://github.com/TrustBound/dream_mock_server" },
]

internal_modules = ["dream_mock_server/internal", "dream_mock_server/internal/*"]

[documentation]
pages = [
    { title = "Getting started", path = "guides/getting-started.html", source = "./docs/guides/getting-started.md" },
    { title = "Test how your client handles failures", path = "guides/testing-failures.html", source = "./docs/guides/testing-failures.md" },
    { title = "Stand in for a third-party API", path = "guides/stand-in-for-an-api.html", source = "./docs/guides/stand-in-for-an-api.md" },
    { title = "Run the server while you develop", path = "guides/run-the-server.html", source = "./docs/guides/run-the-server.md" },
    { title = "Endpoint reference", path = "guides/endpoint-reference.html", source = "./docs/guides/endpoint-reference.md" },
]

[dependencies]
dream_http_server = ">= 2.0.0 and < 3.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 2.2.0 and < 4.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"

# dream_test and dream_snippets are not on Hex yet. Each is switched to a Hex
# version range once it is published. The guide "Getting started" shows the
# dream_test line.
[dev-dependencies]
dream_test = { git = "https://github.com/TrustBound/dream_test.git", ref = "1639959578a14ae3577f8e3ae5cac058f933aa53" }
dream_snippets = { git = "https://github.com/TrustBound/dream_snippets.git", ref = "96cf9a146a608e5cf82afab23600eec852de3d6b" }
gleam_httpc = ">= 5.0.0 and < 6.0.0"

[tools.dream_snippets]
checked_from_version = "2.0.0"
tested_files = ["test", ".github", "scripts", "gleam.toml"]
